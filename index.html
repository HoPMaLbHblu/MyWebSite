<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="MyWebSite — мой уголок в интернете. Скоро здесь появится больше интересного.">
  <title>MyWebSite — мой уголок в интернете</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101827; color: #f4f7fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px; background: radial-gradient(ellipse at 50% 0%, #263b5d 0, #101827 56%); }
    main { width: min(100%, 760px); padding: clamp(32px, 8vw, 76px); border: 1px solid #ffffff1c; border-radius: 28px; background: #ffffff08; box-shadow: 0 24px 80px #0004; }
    .tag { display: inline-flex; align-items: center; gap: 9px; color: #a9bbd4; font-size: .82rem; letter-spacing: .12em; text-transform: uppercase; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #79e2bb; box-shadow: 0 0 14px #79e2bb99; }
    h1 { margin: 26px 0 18px; font-size: clamp(2.7rem, 9vw, 5.5rem); line-height: .98; letter-spacing: -.065em; }
    h1 span { color: #91b8ff; }
    p { max-width: 540px; color: #bdc8d8; font-size: clamp(1.05rem, 2.6vw, 1.25rem); line-height: 1.75; }
    .note { margin-top: 38px; padding-top: 22px; border-top: 1px solid #ffffff1c; color: #8291a7; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <div class="tag"><span class="dot" aria-hidden="true"></span>Сайт опубликован</div>
    <h1>Привет,<br>это <span>MyWebSite.</span></h1>
    <p>Мой уголок в интернете. Здесь скоро появятся проекты, идеи и всё, чем захочется поделиться.</p>
    <div class="note">Страница уже доступна всем по этой ссылке. Заглядывайте снова!</div>
  </main>
</body>
</html>
